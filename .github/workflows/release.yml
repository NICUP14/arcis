# Publishes a GitHub release when a version tag (v1.2.3) is pushed for a commit on main:
#   Arcis-<version>.apk            the phone app (signed with the release key)
#   ArcisBridge-<version>.msi      the Windows installer for the Arcis Bridge
# One-time setup (signing key as repository secrets): see docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Merge into main first, then tag."
            exit 1
          fi
      - name: Version from the tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $tag must look like v1.2.3 (or v1.2.3-beta.1)."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # Android versionCode: 1.2.3 -> 10203 (always increasing).
          echo "code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  android:
    name: Phone app (APK)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android SDK 37
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" || sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCIS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ARCIS_KEYSTORE_BASE64 secret is missing. See docs/releasing.md (one-time setup)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arcis.jks"
          echo "ARCIS_KEYSTORE=$RUNNER_TEMP/arcis.jks" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          ARCIS_KEYSTORE_PASSWORD: ${{ secrets.ARCIS_KEYSTORE_PASSWORD }}
          ARCIS_KEY_ALIAS: ${{ secrets.ARCIS_KEY_ALIAS }}
          ARCIS_KEY_PASSWORD: ${{ secrets.ARCIS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleRelease \
            -PversionName=${{ needs.check.outputs.version }} -PversionCode=${{ needs.check.outputs.code }}
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/Arcis-${{ needs.check.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/out/*.apk

  windows:
    name: Arcis Bridge (Windows installer)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Test
        working-directory: bridge
        run: go test ./...
      - name: WiX 5
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the installer
        shell: pwsh
        run: ./bridge/build.ps1 -Version ${{ needs.check.outputs.version }} -OutDir "${{ runner.temp }}/out"
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: ${{ runner.temp }}/out/*.msi

  release:
    name: Publish the release
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Arcis ${{ needs.check.outputs.version }}
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            **New here?** Start with the [getting started guide](https://github.com/${{ github.repository }}/blob/main/docs/getting-started.md).

            | File | What it is |
            |---|---|
            | `Arcis-${{ needs.check.outputs.version }}.apk` | The phone app (Android 11 or newer). Install it on your phone. |
            | `ArcisBridge-${{ needs.check.outputs.version }}.msi` | Only if you want to use your **Windows** PC on the glasses. Install it on the PC. |

            Windows may say "Windows protected your PC" for the installer (it isn't code-signed yet): click **More info → Run anyway**.
          files: |
            out/*.apk
            out/*.msi
            out/SHA256SUMS.txt
